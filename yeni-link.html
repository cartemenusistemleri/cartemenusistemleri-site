<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Yeni Ödeme Linki</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#4A1826; --ink-soft:#8B6E76; --ink-faint:#B49CA0;
    --surface:#FFFDF8; --surface-2:#FAF3E4; --surface-3:#F3E8D0;
    --line:rgba(74,24,38,0.12);
    --shadow:0 1px 2px rgba(74,24,38,0.04), 0 10px 26px -14px rgba(74,24,38,0.16);
    --page-bg:#4A1826; --page-bg-soft:#5A2130;
    --cream:#FFFDF6; --cream-soft:rgba(255,253,246,0.72);
    --good:#0ca30c; --bad:#c0392b;
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  body{
    background:linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-soft) 100%); color:var(--ink);
    font-family:'Jost', -apple-system, 'Segoe UI', sans-serif;
    padding-inline:16px; padding-block:36px 60px;
    min-height:100vh;
  }
  h1{ font-family:'Cormorant', Georgia, serif; font-style:italic; font-weight:600; margin:0; font-size:26px; color:var(--cream); }
  p{ margin:0; }
  .wrap{ max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:22px; align-items:center; }
  .wordmark{ display:flex; align-items:center; gap:10px; }
  .wordmark .logo{ font-family:'Allura',cursive; font-size:36px; color:var(--cream); line-height:1; }
  .wordmark .tag{
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--cream); font-weight:600;
    background:var(--ink); border:1px solid var(--cream); border-radius:999px; padding:4px 11px; display:inline-block;
  }
  .heading{ text-align:center; display:flex; flex-direction:column; gap:6px; }
  .heading .subtitle{ font-size:13.5px; color:var(--cream-soft); }
  .card{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:22px 20px 20px; display:flex; flex-direction:column; gap:16px;
  }
  label{ font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:6px; }
  .field{ display:flex; flex-direction:column; margin-bottom:14px; }
  input{
    width:100%; font:inherit; font-size:15px; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); outline:none;
  }
  input:focus{ border-color:var(--ink-faint); }
  button.submit{
    margin-top:4px; width:100%; padding:13px; border:none; border-radius:10px; cursor:pointer;
    background:var(--ink); color:var(--cream); font:inherit; font-size:14.5px; font-weight:600; letter-spacing:0.02em;
    transition:opacity .15s ease;
  }
  button.submit:disabled{ opacity:.6; cursor:default; }
  .msg{ font-size:13px; font-weight:600; min-height:16px; margin:10px 0 0; }
  .msg.good{ color:var(--good); }
  .msg.bad{ color:var(--bad); }
  .result{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:13px 14px; display:flex; flex-direction:column; gap:8px; }
  .result .box-row{ display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .result a{ color:var(--ink); font-weight:600; word-break:break-all; font-size:14px; }
  .copy-btn{
    flex:none; width:36px; height:36px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .copy-btn svg{ width:16px; height:16px; }
  @media (max-width:420px){ .card{ padding:18px 15px 16px; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap">

<div class="wrap">
  <div class="wordmark"><span class="logo">Carte</span><span class="tag">Yönetim</span></div>
  <div class="heading">
    <h1>Yeni Ödeme Linki</h1>
    <p class="subtitle">IBAN bilgisini gir, rastgele ve isimsiz bir ödeme linki oluştur.</p>
  </div>
  <div class="card">
    <form id="form">
      <div class="field">
        <label for="secret">Yönetici Şifresi</label>
        <input type="password" id="secret" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="isletme">İşletme Adı veya Kişi Adı</label>
        <input type="text" id="isletme" placeholder="ör. Cafe Şölen" autocomplete="off">
      </div>
      <div class="field">
        <label for="banka">Banka Adı (opsiyonel)</label>
        <input type="text" id="banka" placeholder="ör. Ziraat Bankası" autocomplete="off">
      </div>
      <div class="field">
        <label for="iban">IBAN</label>
        <input type="text" id="iban" placeholder="TR.." autocomplete="off" required>
      </div>
      <div class="field">
        <label for="isim">Hesap Sahibi</label>
        <input type="text" id="isim" placeholder="Ad Soyad" autocomplete="off" required>
      </div>
      <button type="submit" class="submit" id="submitBtn">Link Oluştur</button>
      <p class="msg" id="msg"></p>
    </form>
    <div class="result" id="result" hidden>
      <span class="box-row">
        <a id="resultLink" href="#" target="_blank" rel="noopener"></a>
        <button type="button" class="copy-btn" id="copyLinkBtn" title="Linki kopyala">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </span>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var secretEl = document.getElementById('secret');
  try{
    var saved = sessionStorage.getItem('carte_admin_secret');
    if (saved) secretEl.value = saved;
  }catch(e){}

  try{
    var qs = new URLSearchParams(window.location.search);
    var qIban = qs.get('iban');
    var qIsim = qs.get('isim');
    var qIsletme = qs.get('isletme');
    var qBanka = qs.get('banka');
    if (qIban) document.getElementById('iban').value = qIban;
    if (qIsim) document.getElementById('isim').value = qIsim;
    if (qIsletme) document.getElementById('isletme').value = qIsletme;
    if (qBanka) document.getElementById('banka').value = qBanka;
    if (qIban || qIsim || qIsletme || qBanka){
      if (secretEl.value){ document.getElementById('submitBtn').focus(); }
      else { secretEl.focus(); }
    }
  }catch(e){}

  document.getElementById('form').addEventListener('submit', function(ev){
    ev.preventDefault();
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');
    var resultBox = document.getElementById('result');
    resultBox.hidden = true;
    msg.textContent = '';
    msg.className = 'msg';

    var secret = secretEl.value.trim();
    var iban = document.getElementById('iban').value.trim();
    var isim = document.getElementById('isim').value.trim();
    var isletme = document.getElementById('isletme').value.trim();
    var banka = document.getElementById('banka').value.trim();

    if (!secret || !iban || !isim){
      msg.textContent = 'Tüm alanları doldurun.';
      msg.className = 'msg bad';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Oluşturuluyor...';

    fetch('/api/olustur', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-secret': secret },
      body: JSON.stringify({ iban: iban, isim: isim, isletme: isletme, banka: banka })
    }).then(function(r){ return r.json().then(function(data){ return { status: r.status, data: data }; }); })
    .then(function(res){
      btn.disabled = false;
      btn.textContent = 'Link Oluştur';
      if (res.status === 200 && res.data && res.data.ok){
        try{ sessionStorage.setItem('carte_admin_secret', secret); }catch(e){}
        var link = document.getElementById('resultLink');
        link.textContent = res.data.url;
        link.href = res.data.url;
        resultBox.hidden = false;
        msg.textContent = 'Link oluşturuldu.';
        msg.className = 'msg good';
        document.getElementById('iban').value = '';
        document.getElementById('isim').value = '';
        document.getElementById('isletme').value = '';
        document.getElementById('banka').value = '';
      } else {
        msg.textContent = (res.data && res.data.error) || 'Bir hata oluştu.';
        msg.className = 'msg bad';
      }
    }).catch(function(){
      btn.disabled = false;
      btn.textContent = 'Link Oluştur';
      msg.textContent = 'Bağlantı hatası, tekrar deneyin.';
      msg.className = 'msg bad';
    });
  });

  document.getElementById('copyLinkBtn').addEventListener('click', function(){
    var link = document.getElementById('resultLink').textContent;
    if (!link) return;
    function done(ok){
      var msg = document.getElementById('msg');
      msg.textContent = ok ? 'Link kopyalandı ✓' : 'Kopyalanamadı';
      msg.className = 'msg ' + (ok ? 'good' : 'bad');
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){ done(true); }).catch(function(){ done(false); });
    } else {
      try{
        var ta = document.createElement('textarea');
        ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      }catch(e){ done(false); }
    }
  });
})();
</script>
</body></html>
