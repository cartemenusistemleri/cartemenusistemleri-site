body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}

<body>
<!-- Salon afişindeki ve davet mesajındaki bağlantı buraya gelir: kaynağı not eder, başvuru formuna geçer.
     ?k=afis (salon afişi QR), ?k=wa (WhatsApp daveti), yoksa genel. -->
<p><b>COMEBACK<i>.</i></b><a href="/comeback/#/basvuru" id="git">Başvuru formuna geç</a></p>
<script>
(function () {
  var k = new URLSearchParams(location.search).get('k') || '';
  var KAYNAK = { afis: 'Salon afişi', wa: 'WhatsApp daveti', ig: 'Instagram' };
  var OLAY = { afis: 'giris_afis', wa: 'giris_wa', ig: 'giris_ig' };
  try { if (KAYNAK[k]) sessionStorage.setItem('cb-kaynak', KAYNAK[k]); } catch (e) { /* yok */ }
  try {
    fetch('/api/comeback/hesap/olay', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ olay: OLAY[k] || 'giris_qr' }), keepalive: true, credentials: 'same-origin' }).catch(function () {});
  } catch (e) { /* yok */ }
  location.replace('/comeback/#/basvuru');
})();
</script>
</body>
